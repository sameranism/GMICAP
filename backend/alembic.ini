[alembic]
script_location = migrations
version_locations = %(here)s/migrations/central
prepend_sys_path = ..
version_path_separator = os
# The URL is intentionally not stored here: it contains a password.
# migrations/env.py reads ETEMAD_DB_CENTRAL_URL at runtime.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
