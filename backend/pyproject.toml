[project]
name = "etemad-backend"
version = "0.0.0"
description = "ETEMAD newsroom backend scaffold; not production ready"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.50",
  "psycopg[binary]==3.2.6",
  "redis==5.2.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.11.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Runtime entry point: python -m uvicorn backend.app.main:app --host 127.0.0.1
