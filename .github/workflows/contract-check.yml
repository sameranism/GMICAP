name: contract-check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contract layer (S00-017 / S00-018)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install validator dependency
        run: python -m pip install --upgrade pip jsonschema==4.26.0

      - name: lint changed JSON and Markdown local links
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          from urllib.parse import unquote, urlsplit
          
          LINK = re.compile(r'!?\[[^\]\n]*\]\(\s*(?:<([^>\n]+)>|([^\s)]+))')
          FENCE = re.compile(r'^\s{0,3}(`{3,}|~{3,})')
          INLINE_CODE = re.compile(r'(`+).*?\1')
          
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          
          def changed_paths():
              base = os.environ.get('DIFF_BASE', '')
              if base and re.fullmatch(r'[0-9a-f]{40}', base) is None:
                  raise ValueError('Invalid diff base')
              if not base or base == '0' * 40:
                  parent = subprocess.run(['git', 'rev-parse', '--verify', 'HEAD^'],
                                          capture_output=True, text=True)
                  if parent.returncode:
                      return git('ls-files', '-z').decode().split('\0')
                  base = parent.stdout.strip()
              return git('diff', '--name-only', '--diff-filter=ACMR', '--no-renames',
                         '-z', base, 'HEAD', '--').decode().split('\0')
          
          
          def invalid_constant(_value):
              raise ValueError('Non-standard JSON constant')
          
          
          def check_file(root, relative):
              path = root / relative
              if path.suffix.lower() not in {'.json', '.md'}:
                  return []
              if not path.resolve().is_relative_to(root):
                  return [f'{relative}: path outside repository']
              try:
                  data = path.read_text(encoding='utf-8')
                  if path.suffix.lower() == '.json':
                      json.loads(data, parse_constant=invalid_constant)
                      return []
              except (OSError, UnicodeError, ValueError):
                  return [f'{relative}: invalid or unreadable file']
              failures = []
              fence = None
              for line_no, line in enumerate(data.splitlines(), 1):
                  match = FENCE.match(line)
                  if match:
                      marker = match.group(1)
                      if fence is None:
                          fence = marker
                      elif marker[0] == fence[0] and len(marker) >= len(fence):
                          fence = None
                      continue
                  if fence is not None:
                      continue
                  for match in LINK.finditer(INLINE_CODE.sub('', line)):
                      target = match.group(1) or match.group(2)
                      try:
                          url = urlsplit(target)
                          if url.scheme or url.netloc or not url.path:
                              continue
                          decoded = unquote(url.path)
                          candidate = (root / decoded.lstrip('/') if decoded.startswith('/')
                                       else path.parent / decoded).resolve()
                          if not candidate.is_relative_to(root) or not candidate.exists():
                              failures.append(f'{relative}:{line_no}: missing or out-of-repository local link')
                      except (OSError, ValueError):
                          failures.append(f'{relative}:{line_no}: invalid local link')
              return failures
          
          
          def self_test():
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory).resolve()
                  (root / 'docs').mkdir()
                  (root / 'docs' / 'target.md').write_text('# Target', encoding='utf-8')
                  examples = {
                      'ok.json': ('{"ok": true}', False),
                      'bad.json': ('{"broken":', True),
                      'nan.json': ('{"bad": NaN}', True),
                      'docs/ok.md': ('[local](target.md#x) [external](https://example.com) [anchor](#x)\n'
                                     '```md\n[example](missing.md)\n```\n`[example](missing.md)`', False),
                      'docs/missing.md': ('[broken](absent.md)', True),
                      'docs/escape.md': ('[outside](../../outside.md)', True),
                  }
                  for name, (content, expected) in examples.items():
                      (root / name).write_text(content, encoding='utf-8')
                      if bool(check_file(root, name)) != expected:
                          raise RuntimeError(f'Path lint self-test failed: {name}')
              print('Changed-file lint self-test: PASS (6 cases)')
          
          
          self_test()
          root = Path.cwd().resolve()
          paths = [p for p in changed_paths() if p and Path(p).suffix.lower() in {'.json', '.md'}]
          failures = [problem for path in paths for problem in check_file(root, path)]
          for problem in failures:
              print(problem)
          if failures:
              raise SystemExit(1)
          print(f'Changed JSON and inline Markdown local links: PASS ({len(paths)} files)')
          PY

      - name: validate all schemas and examples
        run: python tools/validate_contracts.py

      - name: Gate-00 foundation checks
        run: python tools/check_gate00.py

      - name: package boundary check
        run: python tools/check_boundaries.py --self-test && python tools/check_boundaries.py

  backend-tests:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.128.2 uvicorn==0.54.0 pydantic==2.13.5 \
            sqlalchemy==2.0.50 "psycopg[binary]==3.2.6" redis==5.2.1 httpx==0.28.1 \
            jsonschema==4.26.0 pytest==9.0.2

      - name: run tests
        run: python -m pytest -q backend/tests
