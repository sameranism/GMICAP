name: merge-guardian

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify review selection and report new main commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def command(*args):
              return subprocess.check_output(args, text=True)

          def api(path):
              pages = json.loads(command("gh", "api", "--paginate", "--slurp", path))
              return [item for page in pages for item in page]

          ROUTINE_FILES = {
              'backend/modules/processing/classifier.py',
              'backend/modules/processing/deduplicator.py',
              'backend/modules/processing/extractor.py',
              'backend/modules/processing/normalizer.py',
              'frontend/src/styles/globals.css',
          }

          def sensitive(files, count):
              if not files or len(files) != count:
                  return True
              return any(item.get('filename') not in ROUTINE_FILES
                         or (item.get('previous_filename') is not None
                             and item['previous_filename'] not in ROUTINE_FILES)
                         for item in files)

          def reviewer_approved(pr, reviews):
              latest_decisions = {}
              for review in sorted(reviews, key=lambda item: item["id"]):
                  login = review["user"]["login"]
                  if (review["user"].get("type") != "User"
                          or login.casefold() == pr["user"]["login"].casefold()):
                      continue
                  if review["state"] in {"APPROVED", "CHANGES_REQUESTED", "DISMISSED"}:
                      latest_decisions[login.casefold()] = review
              return any(
                  review["state"] == "APPROVED"
                  and review["commit_id"] == pr["head"]["sha"]
                  and review["author_association"] in {"OWNER", "MEMBER", "COLLABORATOR"}
                  for review in latest_decisions.values()
              )

          pr = {"user": {"login": "author"}, "head": {"sha": "head"}}
          approval = {"id": 1, "user": {"login": "reviewer", "type": "User"}, "state": "APPROVED",
                      "commit_id": "head", "author_association": "COLLABORATOR"}
          assert reviewer_approved(pr, [approval])
          assert not reviewer_approved(pr, [])
          assert not reviewer_approved(pr, [approval | {"user": {"login": "AUTHOR", "type": "User"}}])
          assert not reviewer_approved(pr, [approval | {"user": {"login": "bot", "type": "Bot"}}])
          assert not reviewer_approved(pr, [approval | {"commit_id": "stale"}])
          assert not reviewer_approved(pr, [approval | {"author_association": "NONE"}])
          for state in ("CHANGES_REQUESTED", "DISMISSED"):
              assert not reviewer_approved(pr, [approval, approval | {"id": 2, "state": state}])
          assert reviewer_approved(pr, [approval, approval | {"id": 2, "state": "COMMENTED"}])
          print("Review selection fixtures: 9 passed")
          ordinary = {"filename": "backend/modules/processing/classifier.py"}
          assert not sensitive([ordinary], 1)
          assert sensitive([], 0)
          assert sensitive([ordinary], 2)
          assert sensitive([ordinary | {"previous_filename": "backend/core/auth.py"}], 1)
          assert sensitive([{"filename": ".github/workflows/merge-guardian.yml"}], 1)
          print("Scope classification fixtures: 5 passed")

          repo = os.environ["GH_REPO"]

          def required_review(pr):
              files = api(f"repos/{repo}/pulls/{pr['number']}/files")
              if not sensitive(files, pr["changed_files"]):
                  return "NOT_REQUIRED"
              reviews = api(f"repos/{repo}/pulls/{pr['number']}/reviews")
              return "PASS" if reviewer_approved(pr, reviews) else "MISSING"

          if os.environ["EVENT"] != "push":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
                  number = json.load(handle)["pull_request"]["number"]
              pr = json.loads(command("gh", "api", f"repos/{repo}/pulls/{number}"))
              verdict = required_review(pr)
              print(f"Independent review: {verdict}")
              if verdict == "MISSING":
                  raise SystemExit("Sensitive change requires independent current-head approval")
              raise SystemExit(0)

          before, after = os.environ["BEFORE"], os.environ["AFTER"]
          subprocess.run(["git", "merge-base", "--is-ancestor", before, after], check=True)
          commits = command("git", "rev-list", "--first-parent", f"{before}..{after}").split()
          missing = []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("| Main commit | Pull request | Independent approval |", file=summary)
              print("| --- | --- | --- |", file=summary)
              for sha in commits:
                  candidates = api(f"repos/{repo}/commits/{sha}/pulls")
                  merged = next((item for item in candidates if item["merged_at"]
                                 and item["merge_commit_sha"] == sha
                                 and item["base"]["ref"] == "main"
                                 and item["base"]["repo"]["full_name"] == repo), None)
                  number = merged["number"] if merged else None
                  pr = (json.loads(command("gh", "api", f"repos/{repo}/pulls/{number}"))
                        if merged else None)
                  ref = f"#{number}" if number else "—"
                  verdict = required_review(pr) if pr else "MISSING_PR"
                  print(f"| `{sha[:12]}` | {ref} | {verdict} |", file=summary)
                  if verdict not in {"PASS", "NOT_REQUIRED"}:
                      missing.append(sha)
          if missing:
              raise SystemExit(f"Missing PR provenance or required independent approval for {len(missing)} main commit(s)")
          PY
