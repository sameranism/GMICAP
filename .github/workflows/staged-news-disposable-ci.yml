name: cloud-news-browser-ci

on:
  push:
    branches: [test/cloud-news-browser]

permissions:
  contents: read

jobs:
  staged-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install declared runtime and test dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("backend/pyproject.toml", "rb") as manifest:
              dependencies = tomllib.load(manifest)["project"]["dependencies"]
          subprocess.run([
              sys.executable, "-m", "pip", "install", "--group",
              "backend/pyproject.toml:dev", "mypy==1.19.1", "alembic==1.20.1",
              "types-jsonschema==4.26.0.20261006", *dependencies,
          ], check=True)
          PY

      - name: Preflight scoped tasks
        run: |
          python tools/preflight.py S02-004
          python tools/preflight.py S02-006
          python tools/preflight.py S03-006
          python tools/preflight.py S03-007
          python tools/preflight.py S01-025
          python tools/preflight.py S08-001
          python tools/preflight.py S08-009
          python tools/preflight.py S08-023
          python tools/preflight.py S09-012

      - name: Lint
        run: python -m ruff check --config 'src=["."]' backend

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy --namespace-packages --explicit-package-bases backend/app backend/core backend/modules

      - name: Validate contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/validate_contracts.py

      - name: Run backend tests
        env:
          ETEMAD_TEST_PG_ADMIN_URL: postgresql://fixture_admin:fixture-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q backend/tests --junitxml=backend-test-results.xml

      - name: Set up Node for browser test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build actual frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Run browser against loopback API and PostgreSQL
        env:
          ETEMAD_TEST_PG_ADMIN_URL: postgresql://fixture_admin:fixture-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        run: python -m pytest -q tools/cloud_news_browser_test.py --junitxml=cloud-browser-results.xml

      - name: Save browser evidence
        uses: actions/upload-artifact@v6
        with:
          name: cloud-browser-evidence
          path: |
            cloud-browser-evidence/
            cloud-browser-results.xml
          if-no-files-found: error

      - name: Save test summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: backend-test-results.xml
          if-no-files-found: error

  staged-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
